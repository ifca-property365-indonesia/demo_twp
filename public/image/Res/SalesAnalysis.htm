<html>

<head>
<meta name="GENERATOR" content="Microsoft FrontPage 4.0">
<meta name="ProgId" content="FrontPage.Editor.Document">
<title>PivotTable Component with Tabular Data</title>
<link rel="STYLESHEET" href="../Styles/OWCStyle.css" type="text/css">
</head>

<body>
<!--
<h1>The PivotTable Component with Tabular Data</h1>
<p>Try selecting the Quantity or ExtendedPrice field, clicking the AutoCalc
toolbar button, and choosing Sum to <a href="vbscript:CreateTotals()">create
totals</a>. Then drag the Country field to the row area on the left side of the
control to see the data <a href="vbscript:GroupByCountry()">grouped by country</a>.&nbsp;Then
drag the City field just inside the Country field to see it <a
href="vbscript:GroupByCity()">additionally grouped by city</a>. Then drag the
Salesperson field to the column area across the top of the report to see the
data cross-tabulated by <a href="vbscript:GroupBySalesperson()">salesperson</a>.
Next, collapse the Salesperson field to <a href="vbscript:JustTheTotals()">see
just the totals</a>. Finally, use the PivotTable <a
href="vbscript:ShowFieldList()">Field List</a> to drag other fields to the view
or filter area.</p>
-->

<!-- PivotTable Control -->
<object classid="clsid:0002E520-0000-0000-C000-000000000046" id="PivotTable1"
width="518" height="384">
<param name="XMLData" value="&lt;xml xmlns:x=&quot;urn:schemas-microsoft-com:office:excel&quot;&gt;
 &lt;x:PivotTable&gt;
  &lt;x:OWCVersion&gt;9.0.0.2710&lt;/x:OWCVersion&gt;
  &lt;x:CacheDetails/&gt;
 &lt;/x:PivotTable&gt;
&lt;/xml&gt;">
</object>

<!-- Scripts -->
<script language=VBScript>
'--------------------------------------------------------------------------
' Window_onLoad()
'
' Purpose: Runs when the page is first loaded in the browser. Code
'          here will connect the PivotTable control to a tabular data
'          source and display the result list.
'
Sub Window_onLoad()
    ' Since there is a lot of data to display,
    ' set AutoFit to False and use 70% for the height
    ' and 100% for the width
    PivotTable1.AutoFit = False
    PivotTable1.height = "70%"
    PivotTable1.width = "100%"
    
    ' Connect to the Northwind sample database.
    ' Note: Change this line if you move the MDB file or want to connect to 
    ' a different MDB file.
    sDBPath = "..\Data\Northwind.mdb"
    
    sSQL = " SELECT mgr.cf_sales_profile.bus_unit_cd as business_unit, " & _
	   " mgr.cf_sales_profile.product_group, mgr.cf_sales_profile.closing_month, " & _
	   " datepart(year, mgr.cf_sales_profile.closing_year) as yearclosed, " & _
           " mgr.cf_sales_profile.sales_amount, mgr.cf_sales_profile.staff_id FROM mgr.cf_sales_profile  "
            
    ConnectToTabular PivotTable1, _
        "Provider=SQLOLEDB.1;Persist Security Info=False;User ID=mgr;Password=mgr;Initial Catalog=ifcacrm_dev;Data Source=ecommerce_nt", sSQL
    
    ' Show all result columns in the report
    PivotTable1.ActiveView.AutoLayout 

    ' Make the numbers look pretty
    set pview = PivotTable1.ActiveView 
    pview.FieldSets("sales_amount").Fields(0).NumberFormat = "$#,##0.00"
    '*** pview.FieldSets("Quantity").Fields(0).NumberFormat = "#,##0"
	
	' Create Totals
	CreateTotals
End Sub 'Window_onLoad()

'--------------------------------------------------------------------------
' ConnectToTabular
'
' Purpose: Connect the PivotTable to the results of a tabular query
'
Sub ConnectToTabular(ptable, sConnString, sSQL)
    ptable.ConnectionString = sConnString
    ptable.CommandText = sSQL
End Sub 'ConnectToTabular()

'--------------------------------------------------------------------------
' HyperLink Event Code
'
' Purpose: Below are the functions that are called when users click
'          the hyperlinks in the text above the PivotTable control
'
Function CreateTotals()
    set c = PivotTable1.Constants
    set pview = PivotTable1.ActiveView 
    
    on error resume next
    pview.DataAxis.InsertTotal _
    pView.AddTotal("Total Sales", pview.FieldSets("sales_amount").Fields(0), _
        c.plFunctionSum)
    'pview.DataAxis.InsertTotal _
    'pView.AddTotal("Total Qty", pview.FieldSets("Quantity").Fields(0), _
    '    c.plFunctionSum)
End Function 'CreateTotal()

Function GroupByCountry()
    on error resume next
    PivotTable1.ActiveView.RowAxis.InsertFieldSet _
        PivotTable1.ActiveView.FieldSets("Country")
End Function 'GroupByCountry()

Function GroupByCity()
    on error resume next
    PivotTable1.ActiveView.RowAxis.InsertFieldSet _
        PivotTable1.ActiveView.FieldSets("City")
End Function 'GroupByCity()

Function GroupBySalesperson()
    on error resume next
    PivotTable1.ActiveView.ColumnAxis.InsertFieldSet _
        PivotTable1.ActiveView.FieldSets("Salesperson")
End Function 'GroupBySalesperson()

Function JustTheTotals()
    on error resume next
    PivotTable1.ActiveView.ColumnAxis.FieldSets(0)._
        Fields(0).Expanded = False
End Function 'JustTheTotals()

Function ShowFieldList()
    PivotTable1.DisplayFieldList = True
End Function 'ShowFieldList()

</script>

</body>

</html>
